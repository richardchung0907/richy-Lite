name: richy_lite
description: RICHY Lite - A beautiful lifestyle/beauty photo filter app.
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.40.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core Image Editor (v13.2.0 — streamlined to filter+tune only)
  pro_image_editor: ^13.2.0

  # Media Input — native camera & gallery
  image_picker: ^1.2.0

  # One-click native social share (Instagram, Facebook, X, WhatsApp, etc.)
  share_plus: ^13.0.0

  # i18n — all UI strings wrapped for future multi-language scaling
  easy_localization: ^3.0.0

  # File system paths
  path_provider: ^2.1.0

  # Save images directly to device gallery
  gal: ^2.3.0

  # Appodeal — ad mediation
  stack_appodeal_flutter: ^4.2.0
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/

dependency_overrides:
  pro_image_editor:
    path: packages/pro_image_editor

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFDFE5"
  image: "assets/images/splash_screen.png"
  android: true
  ios: true
